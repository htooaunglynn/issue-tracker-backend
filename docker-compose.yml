version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: issuetracker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: issuetracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: issuetracker-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: issuetracker-api
    environment:
      PORT: :8080
      ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/issuetracker?sslmode=disable
      JWT_SECRET: dev-secret-key
      JWT_ACCESS_EXPIRY_HOURS: 1
      JWT_REFRESH_EXPIRY_DAYS: 7
      EMAIL_DRIVER: log
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@issuetracker.local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - .:/app
    command: go run ./cmd/api
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
    name: issuetracker-network
